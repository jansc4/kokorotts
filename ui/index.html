<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>KokoroTTS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="app-header">
            <div class="brand">KOKORO<span class="brand__slash">://</span>TTS<span class="cursor"></span></div>
            <div class="service-status" id="status">
                <span class="service-status__dot"></span>
                <span class="service-status__label">checking service…</span>
            </div>
        </header>

        <main class="app-grid">
            <section class="panel panel--input" aria-labelledby="input-label">
                <h2 id="input-label" class="panel__label">01 · Input</h2>
                <textarea id="text-input" class="input-area" placeholder="Wklej lub wpisz tekst do przeczytania…"></textarea>
                <button id="generate-btn" class="btn btn--primary">Generate <span class="btn__arrow">▸</span></button>
            </section>

            <section class="panel panel--controls" aria-labelledby="controls-label">
                <h2 id="controls-label" class="panel__label">02 · Controls</h2>

                
                <span id="open-file-name" class="input-toolbar__filename"></span>

                <button id="play-btn" class="btn btn--play">
                    <span class="btn__icon">▸</span> Play
                </button>

                <div class="control-group control-group--progress">
                    <input type="range" id="progress-range" class="control-range" min="0" max="1" step="0.1" value="0">
                    <div class="progress-times">
                        <span id="time-current">0:00</span>
                        <span id="time-total">0:00</span>
                    </div>
                    <div id="gen-progress" class="gen-progress gen-progress--hidden">
                        <div class="gen-progress__track">
                            <div id="gen-progress-fill" class="gen-progress__fill"></div>
                        </div>
                        <span id="gen-progress-label" class="gen-progress__label">0 / 0</span>
                    </div>
                </div>

                <label class="control-group control-group--checkbox">
                    <input type="checkbox" id="autoplay-check" checked>
                    Autoplay
                </label>

                <div class="control-group">
                    <label class="control-group__label" for="voice-select">Voice</label>
                    <select id="voice-select" class="control-select" disabled>
                        <option>ładowanie…</option>
                    </select>
                </div>

                <div class="control-group">
                    <label class="control-group__label" for="speed-range">Speed <span class="control-group__value" id="speed-value">1.0×</span></label>
                    <input type="range" id="speed-range" class="control-range" min="0.1" max="4" step="0.1" value="1">
                </div>
                <div class="input-toolbar">
                    <button id="export-btn" class="btn" disabled>Export <span class="btn__arrow">⬇</span></button>
                    
                    <button id="open-file-btn" class="btn btn--ghost">Open File <span class="btn__arrow">📄</span></button>
                    <button id="clear-btn" class="btn btn--ghost">Clear <span class="btn__arrow">✕</span></button>
                </div>
                <div class="settings-buttons">
                    <button id="rules-btn" class="btn btn--ghost">Rules</button>
                    <button id="intervals-btn" class="btn btn--ghost">Intervals</button>
                </div>
            </section>

            <section class="panel panel--queue" aria-labelledby="queue-label">
                <h2 id="queue-label" class="panel__label">03 · Queue</h2>
                <div id="sentence-queue" class="queue">
                    <!-- Karty zdań renderowane dynamicznie przez SentenceQueue.js -->
                </div>
            </section>
        </main>
    </div>

    <div id="popup-root"></div>

    <script type="module" src="App.js"></script>
</body>
</html>
